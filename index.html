<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Chiclash Boutique Form</title>

  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", Arial; margin: 16px; }
    h1 { font-size: 18px; margin: 0 0 10px; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .btn { border: 0; border-radius: 10px; padding: 10px 12px; cursor: pointer; background: #2563eb; color: white; font-weight: 600; }
    .btn.secondary { background: #e5e7eb; color: #111827; }
    .btn.warn { background: #ef4444; }
    .muted { color: #6b7280; font-size: 12px; }

    #stage { position: relative; display: inline-block; border: 1px solid #e5e7eb; border-radius: 12px; padding: 8px; }
    #pdfCanvas { display:block; border-radius: 8px; }
    #overlay { position:absolute; left:8px; top:8px; }

    .field { position:absolute; }
    .in {
      box-sizing:border-box;
      border:1px solid #94a3b8; border-radius:8px;
      padding:6px 8px; font-size:14px; background:#ffffffcc;
    }

    .check, .radio { width:18px; height:18px; transform: translate(-2px, -2px); }
    .sigCanvas { border:1px dashed #9ca3af; background:#fff; border-radius:10px; touch-action: none; }

    /* ✅ 内嵌预览区域 */
    #previewWrap { margin-top: 14px; display:none; }
    #previewFrame { width: 100%; height: 70vh; border: 1px solid #e5e7eb; border-radius: 12px; }
  </style>

  <!-- ✅ 按你当前仓库结构，从 /build/ 加载 PDF.js -->
  <script type="module">
    import * as pdfjsLib from './build/pdf.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = './build/pdf.worker.mjs';
    window.pdfjsLib = pdfjsLib;
  </script>

  <!-- ✅ pdf-lib + 手写签名库 -->
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
</head>

<body>

  <!-- ✅ 只保留三个按钮：预览 / 清空签名 / 下载 -->
  <div class="row" style="margin-bottom:10px">
    <button id="previewBtn" class="btn secondary" disabled>Preview</button>
    <button id="downloadBtn" class="btn secondary" disabled>Download PDF</button>
    <button id="sigClear" class="btn warn" disabled>Clear signature</button>
  </div>

  <div id="stage">
    <canvas id="pdfCanvas"></canvas>
    <div id="overlay"></div>
  </div>


  <script>
    /*****************************************************************
     * 字段配置（保持你当前坐标不变）
     *****************************************************************/
    const FIELDS = [
      { id:'firstName', type:'text',  page:0, x:151.8, y:647.6, w: 79.2, h:14.3, fontSize:12, placeholder:'First Name' },
      { id:'lastName',  type:'text',  page:0, x:300.6, y:647.6, w:107.5, h:14.3, fontSize:12, placeholder:'Last Name' },

      { id:'phone',     type:'text',  page:0, x:173.1, y:623.0, w: 79.1, h:14.3, fontSize:12, placeholder:'Phone Number' },
      { id:'email',     type:'text',  page:0, x:290.0, y:623.0, w:107.5, h:14.3, fontSize:12, placeholder:'E-mail' },

      { id:'dob',       type:'date',  page:0, x:119.2, y:597.5, w:107.5, h:14.2, fontSize:12 },

      { id:'hearGoogle', type:'check', page:0, x:255.5, y:571.5, size:12 },
      { id:'hearYelp',   type:'check', page:0, x:320.5, y:571.5, size:12 },
      { id:'hearFriend', type:'check', page:0, x:390.5, y:571.5, size:12 },
      { id:'hearPassby', type:'check', page:0, x:465.0, y:571.5, size:12 },

      { id:'sensitive', type:'radio', page:0,
        options: [
          { id:'sensYes', value:'YES', x:310.0, y:549.0 },
          { id:'sensNo',  value:'NO',  x:380.0, y:549.0 },
        ]
      },

      { id:'init1', type:'check', page:0, x:90.0, y:290.0, size:12 },
      { id:'init2', type:'check', page:0, x:90.0, y:260.0, size:12 },
      { id:'init3', type:'check', page:0, x:90.0, y:215.0, size:12 },
      { id:'init4', type:'check', page:0, x:90.0, y:185.0, size:12 },
      { id:'init5', type:'check', page:0, x:90.0, y:155.0, size:12 },
      { id:'init6', type:'check', page:0, x:90.0, y:125.0, size:12 },

      { id:'printName', type:'text', page:0, x:156.1, y:83.0, w:79.1, h:14.2, fontSize:12, placeholder:'Print Name' },
      { id:'signature', type:'sig',  page:0, x:284.5, y:80.0, w:90.0, h:30.0 },
      { id:'signDate',  type:'date', page:0, x:400.5, y:83.0, w:79.1, h:14.2, fontSize:12 },
    ];

    /*****************************************************************
     * DOM
     *****************************************************************/
    const pdfCanvas = document.getElementById('pdfCanvas');
    const overlay = document.getElementById('overlay');

    const previewBtn = document.getElementById('previewBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const sigClearBtn = document.getElementById('sigClear');

    const previewWrap = document.getElementById('previewWrap');
    const previewFrame = document.getElementById('previewFrame');

    /*****************************************************************
     * 状态
     *****************************************************************/
    let originalPdfBytes = null;
    let viewport = null;
    const scale = 1.5;

    let generatedBlobUrl = null; // 用于 iframe 预览
    let generatedBlob = null;    // 用于下载
    let sigPad = null;

    /*****************************************************************
     * ✅ 自动加载模板（页面刷新即加载）
     *****************************************************************/
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        await loadTemplate();
      } catch (e) {
        console.error(e);
        alert('模板加载失败：请确认 consent_form.pdf 在根目录且大小写一致。');
      }
    });

    async function loadTemplate() {
      const res = await fetch('consent_form.pdf', { cache: 'no-store' });
      if (!res.ok) throw new Error('fetch failed');

      const buf = await res.arrayBuffer();

      // ✅ 关键：复制两份，避免 detached ArrayBuffer
      const pdfjsBytes = buf.slice(0);
      originalPdfBytes = buf.slice(0);

      await renderPreview(pdfjsBytes);

      // 模板加载成功后才能预览/下载
      previewBtn.disabled = false;
    }

    /*****************************************************************
     * 渲染 PDF 预览（第一页）
     *****************************************************************/
    async function renderPreview(bytes) {
      const loadingTask = pdfjsLib.getDocument({ data: bytes });
      const pdfDocProxy = await loadingTask.promise;

      const page = await pdfDocProxy.getPage(1);
      viewport = page.getViewport({ scale });

      const ctx = pdfCanvas.getContext('2d');
      pdfCanvas.width = viewport.width;
      pdfCanvas.height = viewport.height;

      overlay.style.width = viewport.width + 'px';
      overlay.style.height = viewport.height + 'px';
      overlay.innerHTML = '';

      await page.render({ canvasContext: ctx, viewport }).promise;

      buildOverlayFields();

      // 每次重新加载模板，清掉导出结果与预览
      setGenerated(null);
      hidePreview();
    }

    function getScaleFactors() {
      const pxPerPtX = viewport.width / viewport.viewBox[2];
      const pxPerPtY = viewport.height / viewport.viewBox[3];
      return { pxPerPtX, pxPerPtY };
    }

    function pdfPtToDomPx(xPt, yPt) {
      const { pxPerPtX, pxPerPtY } = getScaleFactors();
      const x = xPt * pxPerPtX;
      const y = (viewport.viewBox[3] - yPt) * pxPerPtY;
      return { x, y };
    }

    /*****************************************************************
     * Overlay 固定控件
     *****************************************************************/
    function buildOverlayFields() {
      overlay.innerHTML = '';

      for (const f of FIELDS) {
        if (f.type === 'text' || f.type === 'date') {
          const d = pdfPtToDomPx(f.x, f.y);

          const input = document.createElement('input');
          input.id = f.id;
          input.className = 'field in';
          input.type = (f.type === 'date') ? 'date' : 'text';
          if (f.placeholder) input.placeholder = f.placeholder;

          input.style.left = d.x + 'px';
          input.style.top  = (d.y - (f.h || 18)) + 'px';
          input.style.width = (f.w ? `${f.w * getScaleFactors().pxPerPtX}px` : '180px');

          overlay.appendChild(input);
        }

        if (f.type === 'check') {
          const d = pdfPtToDomPx(f.x, f.y);

          const cb = document.createElement('input');
          cb.id = f.id;
          cb.className = 'field check';
          cb.type = 'checkbox';
          cb.style.left = d.x + 'px';
          cb.style.top  = (d.y - 14) + 'px';

          overlay.appendChild(cb);
        }

        if (f.type === 'radio') {
          const name = f.id;
          for (const opt of f.options) {
            const d = pdfPtToDomPx(opt.x, opt.y);

            const rb = document.createElement('input');
            rb.id = opt.id;
            rb.className = 'field radio';
            rb.type = 'radio';
            rb.name = name;
            rb.value = opt.value;

            rb.style.left = d.x + 'px';
            rb.style.top  = (d.y - 14) + 'px';

            overlay.appendChild(rb);
          }
        }

        if (f.type === 'sig') {
          const d = pdfPtToDomPx(f.x, f.y);
          const { pxPerPtX, pxPerPtY } = getScaleFactors();

          const cssW = Math.round(f.w * pxPerPtX);
          const cssH = Math.round(f.h * pxPerPtY);
          const ratio = Math.max(1, Math.floor(window.devicePixelRatio || 1));

          const canvas = document.createElement('canvas');
          canvas.id = f.id;
          canvas.className = 'field sigCanvas';
          canvas.style.left = d.x + 'px';
          canvas.style.top  = (d.y - cssH) + 'px';
          canvas.style.width = cssW + 'px';
          canvas.style.height = cssH + 'px';

          canvas.width = cssW * ratio;
          canvas.height = cssH * ratio;

          overlay.appendChild(canvas);

          sigPad = new SignaturePad(canvas, { backgroundColor: 'rgba(255,255,255,1)' });

          const ctx = canvas.getContext('2d');
          ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

          sigClearBtn.disabled = false;
        }
      }
    }

    sigClearBtn.addEventListener('click', () => {
      if (sigPad) sigPad.clear();
    });

    /*****************************************************************
     * 生成 PDF（写回）——保持你的绘制逻辑不变
     *****************************************************************/
    function formatMMDD(dateValue) {
      if (!dateValue) return '';
      const parts = String(dateValue).split('-');
      if (parts.length !== 3) return dateValue;
      return `${parts[1]}/${parts[2]}`;
    }

    function getValueById(id) {
      const el = document.getElementById(id);
      return el ? (el.value || '') : '';
    }

    function getCheckedById(id) {
      const el = document.getElementById(id);
      return !!(el && el.checked);
    }

    function getRadioValue(groupId, fallback='') {
      const checked = document.querySelector(`input[type="radio"][name="${groupId}"]:checked`);
      return checked ? checked.value : fallback;
    }

    function setGenerated(blob) {
      if (generatedBlobUrl) {
        URL.revokeObjectURL(generatedBlobUrl);
        generatedBlobUrl = null;
      }

      generatedBlob = blob;
      downloadBtn.disabled = true;

      if (!blob) return;

      generatedBlobUrl = URL.createObjectURL(blob);
      downloadBtn.disabled = false;
    }

    async function generatePdfBlob() {
      if (!originalPdfBytes) return null;

      // ✅ 额外稳：每次生成都 slice 一份给 pdf-lib
      const pdfDoc = await PDFLib.PDFDocument.load(originalPdfBytes.slice(0));
      const page = pdfDoc.getPages()[0];
      const font = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);

      // 文本/日期
      for (const f of FIELDS) {
        if (f.type === 'text') {
          const v = getValueById(f.id).trim();
          if (!v) continue;
          page.drawText(v, { x: f.x, y: f.y, size: f.fontSize || 12, font, color: PDFLib.rgb(0,0,0) });
        }
        if (f.type === 'date') {
          const raw = getValueById(f.id);
          const v = (f.id === 'dob' || f.id === 'signDate') ? formatMMDD(raw) : raw;
          if (!v) continue;
          page.drawText(String(v), { x: f.x, y: f.y, size: f.fontSize || 12, font, color: PDFLib.rgb(0,0,0) });
        }
      }

      // checkbox：只画对勾
      function drawCheckMarkOnly(x, y, size) {
        page.drawLine({
          start: { x: x + 1.5, y: y + size * 0.45 },
          end:   { x: x + size * 0.40, y: y + 1.5 },
          thickness: 1.6,
          color: PDFLib.rgb(0,0,0),
        });
        page.drawLine({
          start: { x: x + size * 0.38, y: y + 1.5 },
          end:   { x: x + size - 1.5,  y: y + size - 1.5 },
          thickness: 1.6,
          color: PDFLib.rgb(0,0,0),
        });
      }

      for (const f of FIELDS) {
        if (f.type === 'check') {
          if (getCheckedById(f.id)) {
            drawCheckMarkOnly(f.x, f.y, f.size || 12);
          }
        }
      }

      // radio：画圆 + 实心点
      const sens = getRadioValue('sensitive', '');
      const sensField = FIELDS.find(x => x.type === 'radio' && x.id === 'sensitive');
      if (sensField) {
        for (const opt of sensField.options) {
          page.drawCircle({
            x: opt.x + 6, y: opt.y + 6,
            size: 6,
            borderWidth: 1,
            borderColor: PDFLib.rgb(0,0,0),
            color: PDFLib.rgb(1,1,1),
          });
          if (sens === opt.value) {
            page.drawCircle({
              x: opt.x + 6, y: opt.y + 6,
              size: 3,
              color: PDFLib.rgb(0,0,0),
            });
          }
        }
      }

      // 签名：仅手写签名
      const sigField = FIELDS.find(x => x.id === 'signature');
      if (sigField) {
        if (sigPad && !sigPad.isEmpty()) {
          const pngDataUrl = sigPad.toDataURL('image/png');
          const png = await pdfDoc.embedPng(pngDataUrl);
          page.drawImage(png, {
            x: sigField.x,
            y: sigField.y,
            width: sigField.w,
            height: sigField.h
          });
        }
      }

      const bytes = await pdfDoc.save();
      return new Blob([bytes], { type: 'application/pdf' });
    }

    /*****************************************************************
     * ✅ 预览按钮：点击后先生成，再展示预览（合并生成+预览）
     * - 若预览已打开：再次点击则关闭预览（仍然只有三个按钮）
     *****************************************************************/
    function showPreview() {
      if (!generatedBlobUrl) return;
      previewWrap.style.display = 'block';
      previewFrame.src = generatedBlobUrl;
      previewBtn.textContent = 'Close Preview';
    }

    function hidePreview() {
      previewWrap.style.display = 'none';
      previewFrame.src = 'about:blank';
      previewBtn.textContent = 'Preview';
    }

    previewBtn.addEventListener('click', async () => {
      // 已打开 -> 关闭
      if (previewWrap.style.display !== 'none' && previewWrap.style.display !== '') {
        hidePreview();
        return;
      }

      // 未打开 -> 先生成再预览
      const blob = await generatePdfBlob();
      if (!blob) {
        alert('Loading... please wait.');
        return;
      }
      setGenerated(blob);
      showPreview();
    });

    /*****************************************************************
     * ✅ 下载命名：FirstName_LastName_Consent.pdf
     *****************************************************************/
    function sanitizeFilenamePart(s) {
      return String(s || '')
        .trim()
        .replace(/\s+/g, '_')
        .replace(/[\/\\:*?"<>|]/g, '');
    }

    function buildDownloadName() {
      const first = sanitizeFilenamePart(getValueById('firstName'));
      const last  = sanitizeFilenamePart(getValueById('lastName'));

  // 生成 fn_ln.pdf
      if (first && last) return `${first}_${last}.pdf`;

  // 只填了一个名字时：名字.pdf
      if (first) return `${first}.pdf`;
      if (last)  return `${last}.pdf`;

  // 都没填：兜底
      return 'Filled.pdf';
    }

    /*****************************************************************
     * 下载：如果用户没点过预览（还没生成），会自动先生成再下载
     *****************************************************************/
    downloadBtn.addEventListener('click', async () => {
      // 若没有生成过，自动生成一次（更符合用户直觉）
      if (!generatedBlob) {
        const blob = await generatePdfBlob();
        if (!blob) {
          alert('Loading... Please wait.');
          return;
        }
        setGenerated(blob);
      }

      if (!generatedBlob) return;

      if (window.navigator && window.navigator.msSaveOrOpenBlob) {
        window.navigator.msSaveOrOpenBlob(generatedBlob, buildDownloadName());
        return;
      }

      const url = URL.createObjectURL(generatedBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = buildDownloadName();
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      a.remove();

      setTimeout(() => URL.revokeObjectURL(url), 1500);
    });
  </script>
</body>
</html>
